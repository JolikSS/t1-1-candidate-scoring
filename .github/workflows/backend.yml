name: Backend checks

on:
  push:
    branches: [main, feature/backend-api]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python tools/check_backend.py

  integration:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:8.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
      neo4j:
        image: neo4j:5.26-community
        ports: ['7687:7687']
        env:
          NEO4J_AUTH: neo4j/acceptance-test-password
          NEO4J_server_memory_heap_initial__size: 256m
          NEO4J_server_memory_heap_max__size: 512m
          NEO4J_server_memory_pagecache_size: 128m
    env:
      # Test-only credentials for this job's disposable service container.
      NEO4J_PASSWORD: acceptance-test-password
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: >-
          python tools/verify_backend.py
          --mongo-uri mongodb://127.0.0.1:27017
          --neo4j-uri bolt://127.0.0.1:7687
          --batch-size 100 --long-pages 10
      - run: python tools/evaluate_scoring.py docs/examples/benchmark.synthetic.json --calibrate
