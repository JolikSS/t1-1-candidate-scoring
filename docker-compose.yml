services:
  mongo:
    image: mongo:8.0
    container_name: candidate-scoring-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
  neo4j:
    image: neo4j:5.26-community
    container_name: candidate-scoring-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}"
    volumes:
      - neo4j_data:/data

volumes:
  mongo_data:
  neo4j_data:
